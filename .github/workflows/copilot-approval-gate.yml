name: copilot-approval-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_run:
    workflows: ["delivery-controls"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  copilot-approval-gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify trusted controls are published on main
        run: |
          missing=0
          for file in \
            package.json \
            package-lock.json \
            tools/delivery/src/copilotApprovalEvaluator.ts \
            tools/delivery/src/githubCopilotApprovalCheck.ts
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing trusted control file on main: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Trusted approval-gate controls are not yet on main. Publish trusted baseline to main before requiring this check."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Pin npm for gate runtime
        run: npm i -g npm@11.12.1

      - name: Install trusted gate dependencies
        run: npm ci

      - name: Evaluate current-head Copilot approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS_JSON: >
            [{"name":"delivery-controls","appSlug":"github-actions"}]
        run: npm run delivery:copilot-gate:github
