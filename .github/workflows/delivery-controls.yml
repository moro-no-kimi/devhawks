name: delivery-controls

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  delivery-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Pin npm
        run: npm i -g npm@11.12.1

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.11"

      - name: Install habit-hooks tooling
        run: python -m pip install --requirement tools/delivery/requirements-habit-hooks.txt

      - name: Canonical delivery verification aggregate
        run: npm run delivery:verify
